# Separate from docker-compose.yml (local development). Do not combine the files.
name: active-health
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/storage/active_health.db
      COOKIE_SECURE: "true"
      ENABLE_DEMO_ACCOUNTS: "false"
      ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Set SITE_DOMAIN in deploy/.env}
    volumes:
      - app_db:/app/storage
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  app_db:
  app_uploads:
  caddy_data:
  caddy_config:
