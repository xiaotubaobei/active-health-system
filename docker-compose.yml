services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: active
      POSTGRES_PASSWORD: active
      POSTGRES_DB: active_health
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://active:active@db:5432/active_health
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - db

volumes:
  pgdata:
