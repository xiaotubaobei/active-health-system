<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14352c" />
    <title>当前处于离线状态</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #14352c;
        background: #f3f6f4;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main { width: min(100%, 420px); padding: 28px; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px #14352c1a; }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0 0 20px; line-height: 1.7; color: #53635f; }
      button { min-height: 44px; width: 100%; border: 0; border-radius: 12px; color: #fff; background: #16775e; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线状态</h1>
      <p>应用外壳已经可用，但登录、训练记录、报告和视频上传需要网络连接。恢复网络后请重新加载。</p>
      <button type="button" onclick="location.reload()">重新加载</button>
    </main>
  </body>
</html>
